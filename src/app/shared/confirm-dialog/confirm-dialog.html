<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content>
  <p>{{ data.message }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button matButton mat-dialog-close>Cancel</button>
  <button matButton="filled" class="confirm-dialog__confirm" (click)="dialogRef.close(true)">
    {{ data.confirmLabel }}
  </button>
</mat-dialog-actions>
